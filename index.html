<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bantu Dental Hub | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0a6bdf;
            --primary-dark: #0850a8;
            --primary-light: #e8f0fe;
            --dark: #0a1e2f;
            --gray: #4a5a6e;
            --light-gray: #f0f4f8;
            --white: #ffffff;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.10);
            --radius: 16px;
            --transition: 0.3s ease;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--dark);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }

        /* ===== FULL-SCREEN BACKGROUND IMAGE ===== */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0a1e2f, #0a6bdf);
        }

        .bg-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .bg-image .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(10, 30, 47, 0.65), rgba(10, 107, 223, 0.40));
            z-index: 1;
        }

        /* ===== WELCOME SCREEN ===== */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a1e2f, #0a6bdf);
            animation: welcomeFadeOut 3.5s ease-in-out forwards;
        }

        .welcome-screen .welcome-content {
            text-align: center;
            color: var(--white);
            animation: welcomePulse 2s ease-in-out infinite;
        }

        .welcome-screen .welcome-content .icon {
            font-size: 5rem;
            display: block;
            margin-bottom: 16px;
        }

        .welcome-screen .welcome-content h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .welcome-screen .welcome-content h1 .highlight {
            color: #6ab0ff;
        }

        .welcome-screen .welcome-content p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 8px;
        }

        .welcome-screen .welcome-content .loader-bar {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            margin: 20px auto 0;
            overflow: hidden;
        }

        .welcome-screen .welcome-content .loader-bar .fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 10px;
            animation: loadBar 2.5s ease-in-out forwards;
        }

        @keyframes welcomePulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        @keyframes welcomeFadeOut {
            0% {
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                visibility: hidden;
                z-index: -1;
            }
        }

        @keyframes loadBar {
            0% {
                width: 0%;
            }
            100% {
                width: 100%;
            }
        }

        /* ===== LOGIN CONTAINER ===== */
        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            animation: slideUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.5s both;
        }

        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 40px 36px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.10);
        }

        /* ===== LOGO ===== */
        .login-card .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-card .logo .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 4px;
        }

        .login-card .logo h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--white);
            letter-spacing: -0.5px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        .login-card .logo h1 .highlight {
            color: #6ab0ff;
        }

        .login-card .logo p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            margin-top: 2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .login-card .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .login-card .subtitle .lock-icon {
            margin-right: 4px;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 5px;
        }

        .form-group label .required {
            color: #f87171;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px 12px 46px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.08);
            color: var(--white);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 0 3px rgba(10, 107, 223, 0.2);
        }

        .form-group .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.4);
            transition: var(--transition);
            padding: 4px;
        }

        .form-group .toggle-password:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        /* ===== FORM OPTIONS ===== */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .form-options .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }

        .form-options .remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .form-options .forgot {
            color: #6ab0ff;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            font-size: 0.85rem;
        }

        .form-options .forgot:hover {
            color: var(--white);
            text-decoration: underline;
        }

        /* ===== LOGIN BUTTON ===== */
        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: var(--white);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(10, 107, 223, 0.35);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--white);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-login.loading .spinner {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== ERROR MESSAGE ===== */
        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            display: none;
            margin-bottom: 16px;
            align-items: center;
            gap: 10px;
        }

        .error-message.show {
            display: flex;
        }

        /* ===== FOOTER ===== */
        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
        }

        .login-footer .version {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.7rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px 24px;
            }

            .login-card .logo h1 {
                font-size: 1.3rem;
            }

            .login-card .logo .icon {
                font-size: 2.5rem;
            }

            .form-options {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .login-container {
                padding: 12px;
            }

            .welcome-screen .welcome-content h1 {
                font-size: 2rem;
            }

            .welcome-screen .welcome-content .icon {
                font-size: 3.5rem;
            }

            .welcome-screen .welcome-content p {
                font-size: 1rem;
            }
        }

        /* ===== SHAKE ANIMATION ===== */
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-8px);
            }
            20%,
            40%,
            60%,
            80% {
                transform: translateX(8px);
            }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        /* ===== SCROLLBAR STYLING ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- ===== WELCOME SCREEN ===== -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-content">
            <span class="icon">🦷</span>
            <h1><span class="highlight">Bantu</span>Dental hub</h1>
            <p>Clinic Management System</p>
            <div class="loader-bar">
                <div class="fill"></div>
            </div>
        </div>
    </div>

    <!-- ===== FULL-SCREEN BACKGROUND IMAGE ===== -->
    <div class="bg-image">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&h=1080&fit=crop" alt="Ocean Waves" loading="eager" />
        <div class="overlay"></div>
    </div>

    <!-- ===== LOGIN CONTAINER ===== -->
    <div class="login-container">
        <div class="login-card">

            <!-- ===== LOGO ===== -->
            <div class="logo">
                <span class="icon">🦷</span>
                <h1><span class="highlight">Bantu</span>Dental hub</h1>
                <p>Clinic Management System</p>
            </div>

            <!-- ===== SUBTITLE ===== -->
            <div class="subtitle">
                <span class="lock-icon">🔐</span> Please login to continue
            </div>

            <!-- ===== ERROR MESSAGE ===== -->
            <div class="error-message" id="errorMessage">
                <span>❌</span>
                <span id="errorText">Invalid username or password. Please try again.</span>
            </div>

            <!-- ===== LOGIN FORM ===== -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" placeholder="Enter your username" required autofocus />
                    </div>
                </div>

                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔑</span>
                        <input type="password" id="password" placeholder="Enter your password" required />
                        <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
                            👁️
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe" />
                        Remember me
                    </label>
                    <a href="#" class="forgot" onclick="alert('Please contact the administrator to reset your password.')">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text">🚀 Login</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <!-- ===== FOOTER ===== -->
            <div class="login-footer">
                <p>🦷 Bantu Dental Hub v2.0</p>
                <p class="version">© 2026 All Rights Reserved</p>
            </div>

        </div>
    </div>

    <script>
        // ===== DEFAULT CREDENTIALS =====
        const DEFAULT_USERNAME = 'admin';
        const DEFAULT_PASSWORD = 'admin123';

        // ===== TOGGLE PASSWORD VISIBILITY =====
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        // ===== SHOW ERROR =====
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            document.getElementById('errorText').textContent = message;
            errorEl.classList.add('show');
            document.querySelector('.login-card').classList.add('shake');
            setTimeout(() => {
                document.querySelector('.login-card').classList.remove('shake');
            }, 500);
        }

        // ===== HIDE ERROR =====
        function hideError() {
            document.getElementById('errorMessage').classList.remove('show');
        }

        // ===== HANDLE LOGIN =====
        function handleLogin(e) {
            e.preventDefault();
            hideError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');

            if (!username || !password) {
                showError('Please enter both username and password.');
                return;
            }

            loginBtn.classList.add('loading');

            setTimeout(() => {
                if (username === DEFAULT_USERNAME && password === DEFAULT_PASSWORD) {
                    const remember = document.getElementById('rememberMe').checked;
                    if (remember) {
                        localStorage.setItem('rememberMe', 'true');
                        localStorage.setItem('savedUsername', username);
                    } else {
                        localStorage.removeItem('rememberMe');
                        localStorage.removeItem('savedUsername');
                    }
                    sessionStorage.setItem('isLoggedIn', 'true');
                    window.location.href = 'homepage.html';
                } else {
                    loginBtn.classList.remove('loading');
                    showError('Invalid username or password. Please try again.');
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            }, 1200);
        }

        // ===== ENTER KEY SUPPORT =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const form = document.getElementById('loginForm');
                if (form) {
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });

        // ===== CHECK FOR SAVED CREDENTIALS =====
        document.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'homepage.html';
                return;
            }

            const savedUsername = localStorage.getItem('savedUsername');
            const rememberMe = localStorage.getItem('rememberMe');
            if (rememberMe === 'true' && savedUsername) {
                document.getElementById('username').value = savedUsername;
                document.getElementById('rememberMe').checked = true;
                document.getElementById('password').focus();
            }

            // Remove welcome screen after animation completes
            const welcomeScreen = document.getElementById('welcomeScreen');
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
            }, 4000);
        });

        console.log('🔐 Bantu Dental Hub Login System loaded.');
        console.log('👤 Default credentials: admin / admin123');
        console.log('🌊 Background: Ocean photo');
        console.log('✨ Welcome screen appears first, then login!');
    </script>

</body>
</html>
