<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bantu Dental Hub | Patient Files</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ===== SAME STYLES AS INDEX.HTML ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0a6bdf;
            --primary-dark: #0850a8;
            --primary-light: #e8f0fe;
            --dark: #0a1e2f;
            --gray: #4a5a6e;
            --light-gray: #f0f4f8;
            --white: #ffffff;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.10);
            --radius: 16px;
            --transition: 0.3s ease;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--light-gray);
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        /* ===== HEADER ===== */
        .header {
            background: var(--white);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            padding: 0 24px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--dark);
            text-decoration: none;
        }

        .header .logo .brand .bantu { margin-right: 6px; }
        .header .logo .brand .dental { color: var(--primary); }

        .header .back-btn {
            color: var(--gray);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: var(--transition);
        }

        .header .back-btn:hover {
            background: var(--light-gray);
            color: var(--primary);
        }

        /* ===== PATIENT FILE ===== */
        .page-header {
            margin: 24px 0;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 800;
        }

        .page-header h1 .highlight {
            color: var(--primary);
        }

        .page-header p {
            color: var(--gray);
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .search-box input,
        .search-box select {
            padding: 10px 16px;
            border: 2px solid var(--light-gray);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            flex: 1;
            min-width: 200px;
            transition: var(--transition);
        }

        .search-box input:focus,
        .search-box select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-box button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: var(--white);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-box button:hover {
            background: var(--primary-dark);
        }

        .card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 24px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .card-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            text-align: left;
            padding: 12px 16px;
            font-weight: 600;
            color: var(--gray);
            font-size: 0.85rem;
            border-bottom: 2px solid var(--light-gray);
        }

        table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--light-gray);
            font-size: 0.9rem;
        }

        table tr:hover td {
            background: var(--primary-light);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-completed { background: #dcfce7; color: var(--success); }
        .status-scheduled { background: #fef3c7; color: var(--warning); }
        .status-cancelled { background: #fee2e2; color: var(--danger); }
        .status-pending { background: var(--primary-light); color: var(--primary); }

        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: var(--white); }
        .btn-danger { background: var(--danger); color: var(--white); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }

        .no-data {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
        }

        .no-data .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
        }

        /* ===== PATIENT DETAIL MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--white);
            border-radius: var(--radius);
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: var(--shadow-hover);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal .close-btn {
            float: right;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray);
        }

        .modal .close-btn:hover {
            color: var(--danger);
        }

        .modal .detail-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid var(--light-gray);
        }

        .modal .detail-row .label {
            font-weight: 600;
            width: 150px;
            flex-shrink: 0;
            color: var(--gray);
        }

        .modal .detail-row .value {
            color: var(--dark);
        }

        .modal .medication-box {
            background: #f0f8ff;
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            margin-top: 8px;
        }

        .modal .medication-box .med-row {
            display: flex;
            padding: 4px 0;
        }

        .modal .medication-box .med-label {
            font-weight: 600;
            width: 100px;
            color: var(--gray);
        }

        .modal .medication-box .med-value {
            color: var(--dark);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .search-box { flex-direction: column; }
            .search-box input, .search-box select { min-width: 100%; }
            table { font-size: 0.8rem; }
            table th, table td { padding: 8px; }
            .modal { padding: 20px; }
            .modal .detail-row { flex-direction: column; }
            .modal .detail-row .label { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <a href="index.html" class="logo">
            <span class="brand"><span class="bantu">🦷 Bantu</span><span class="dental">Dental hub</span></span>
        </a>
        <a href="index.html" class="back-btn">← Back to Dashboard</a>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main>
        <div class="container">
            <div class="page-header">
                <h1>📁 Patient <span class="highlight">Files</span></h1>
                <p>View and manage all patient records. Search by name, ID, or phone number.</p>
            </div>

            <!-- ===== SEARCH ===== -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search by name, ID, or phone..." oninput="filterPatients()" />
                <select id="statusFilter" onchange="filterPatients()">
                    <option value="all">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="scheduled">Scheduled</option>
                    <option value="completed">Completed</option>
                </select>
                <button onclick="filterPatients()">Search</button>
                <button onclick="clearSearch()" class="btn btn-outline" style="background:transparent;">Clear</button>
            </div>

            <!-- ===== PATIENT LIST ===== -->
            <div class="card">
                <div class="card-header">
                    <h3>📋 All Patients</h3>
                    <span id="patientCount" class="badge" style="padding:4px 12px; background:var(--primary-light); color:var(--primary); border-radius:20px; font-weight:600;">0 patients</span>
                </div>
                <div id="patientList">
                    <div class="no-data">
                        <span class="icon">👥</span>
                        <p>No patients registered yet. <a href="register.html" style="color:var(--primary);">Register your first patient</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== PATIENT DETAIL MODAL ===== -->
    <div class="modal-overlay" id="patientModal">
        <div class="modal">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <h2 id="modalTitle">Patient Details</h2>
            <div id="modalContent"></div>
            <div style="margin-top:16px; display:flex; gap:12px; flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="printPatientFile()">🖨️ Print File</button>
                <button class="btn btn-success" onclick="updateStatus()">✅ Update Status</button>
                <button class="btn btn-danger" onclick="deletePatient()">🗑️ Delete Patient</button>
                <button class="btn btn-outline" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        let currentPatientId = null;

        // ===== GET PATIENTS =====
        function getPatients() {
            return JSON.parse(localStorage.getItem('patients')) || [];
        }

        // ===== DISPLAY PATIENTS =====
        function displayPatients(patients) {
            const container = document.getElementById('patientList');
            const count = document.getElementById('patientCount');

            if (patients.length === 0) {
                container.innerHTML = `
                    <div class="no-data">
                        <span class="icon">👥</span>
                        <p>No patients found.</p>
                    </div>
                `;
                count.textContent = '0 patients';
                return;
            }

            count.textContent = patients.length + ' patients';

            let html = `
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Patient ID</th>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Procedure</th>
                                <th>Doctor</th>
                                <th>Status</th>
                                <th>Review Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            patients.forEach(p => {
                const statusClass = p.status === 'completed' ? 'status-completed' : 
                                  p.status === 'scheduled' ? 'status-scheduled' : 'status-pending';
                html += `
                    <tr>
                        <td><strong>${p.id}</strong></td>
                        <td>${p.firstName} ${p.lastName}</td>
                        <td>${p.phone}</td>
                        <td>${p.procedure}</td>
                        <td>${p.doctor}</td>
                        <td><span class="status-badge ${statusClass}">${p.status || 'Pending'}</span></td>
                        <td>${p.reviewDate || 'Not set'}</td>
                        <td>
                            <button class="btn btn-primary" onclick="viewPatient('${p.id}')" style="padding:4px 12px; font-size:0.75rem;">📄 View</button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        // ===== FILTER PATIENTS =====
        function filterPatients() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            let patients = getPatients();

            if (search) {
                patients = patients.filter(p => 
                    p.firstName.toLowerCase().includes(search) ||
                    p.lastName.toLowerCase().includes(search) ||
                    p.id.toLowerCase().includes(search) ||
                    p.phone.includes(search)
                );
            }

            if (status !== 'all') {
                patients = patients.filter(p => p.status === status);
            }

            displayPatients(patients);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('statusFilter').value = 'all';
            displayPatients(getPatients());
        }

        // ===== VIEW PATIENT =====
        function viewPatient(id) {
            const patients = getPatients();
            const patient = patients.find(p => p.id === id);
            if (!patient) {
                alert('Patient not found.');
                return;
            }

            currentPatientId = id;
            document.getElementById('modalTitle').textContent = `📄 ${patient.firstName} ${patient.lastName} (${patient.id})`;

            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <div style="margin-bottom:16px;">
                    <h4 style="color:var(--primary); margin-bottom:8px;">👤 Personal Information</h4>
                    <div class="detail-row"><span class="label">Patient ID:</span><span class="value">${patient.id}</span></div>
                    <div class="detail-row"><span class="label">Full Name:</span><span class="value">${patient.firstName} ${patient.lastName}</span></div>
                    <div class="detail-row"><span class="label">Age:</span><span class="value">${patient.age}</span></div>
                    <div class="detail-row"><span class="label">Gender:</span><span class="value">${patient.gender}</span></div>
                    <div class="detail-row"><span class="label">Phone:</span><span class="value">${patient.phone}</span></div>
                    <div class="detail-row"><span class="label">Email:</span><span class="value">${patient.email}</span></div>
                    <div class="detail-row"><span class="label">Address:</span><span class="value">${patient.address}</span></div>
                </div>

                <div style="margin-bottom:16px;">
                    <h4 style="color:var(--primary); margin-bottom:8px;">🏥 Medical History</h4>
                    <div class="detail-row"><span class="label">Allergies:</span><span class="value">${patient.allergies}</span></div>
                    <div class="detail-row"><span class="label">Medications:</span><span class="value">${patient.medications}</span></div>
                    <div class="detail-row"><span class="label">Conditions:</span><span class="value">${patient.conditions}</span></div>
                </div>

                <div style="margin-bottom:16px;">
                    <h4 style="color:var(--primary); margin-bottom:8px;">🦷 Treatment Plan</h4>
                    <div class="detail-row"><span class="label">Procedure:</span><span class="value">${patient.procedure}</span></div>
                    <div class="detail-row"><span class="label">Doctor:</span><span class="value">${patient.doctor}</span></div>
                    <div class="detail-row"><span class="label">Description:</span><span class="value">${patient.treatmentDesc}</span></div>
                    <div class="detail-row"><span class="label">Cost:</span><span class="value">$${patient.treatmentCost.toFixed(2)}</span></div>
                    <div class="detail-row"><span class="label">Status:</span><span class="value"><span class="status-badge ${patient.status === 'completed' ? 'status-completed' : patient.status === 'scheduled' ? 'status-scheduled' : 'status-pending'}">${patient.status || 'Pending'}</span></span></div>
                    <div class="detail-row"><span class="label">Review Date:</span><span class="value">${patient.reviewDate}</span></div>
                    <div class="detail-row"><span class="label">Registered:</span><span class="value">${patient.registrationDate}</span></div>
                </div>

                <div>
                    <h4 style="color:var(--primary); margin-bottom:8px;">💊 Prescribed Medication</h4>
                    <div class="medication-box">
                        <div class="med-row"><span class="med-label">💊 Medication:</span><span class="med-value">${patient.medication.name}</span></div>
                        <div class="med-row"><span class="med-label">📊 Dosage:</span><span class="med-value">${patient.medication.dosage}</span></div>
                        <div class="med-row"><span class="med-label">🕐 Frequency:</span><span class="med-value">${patient.medication.frequency}</span></div>
                        <div class="med-row"><span class="med-label">📅 Duration:</span><span class="med-value">${patient.medication.duration}</span></div>
                        ${patient.medication.notes !== 'N/A' ? `<div class="med-row"><span class="med-label">📝 Notes:</span><span class="med-value">${patient.medication.notes}</span></div>` : ''}
                    </div>
                </div>
            `;

            document.getElementById('patientModal').classList.add('active');
        }

        // ===== UPDATE STATUS =====
        function updateStatus() {
            if (!currentPatientId) return;
            const patients = getPatients();
            const patient = patients.find(p => p.id === currentPatientId);
            if (!patient) return;

            const statuses = ['pending', 'scheduled', 'completed'];
            const currentIndex = statuses.indexOf(patient.status || 'pending');
            const nextIndex = (currentIndex + 1) % statuses.length;
            patient.status = statuses[nextIndex];

            savePatients(patients);
            closeModal();
            displayPatients(patients);
            alert(`✅ Status updated to: ${patient.status}`);
        }

        // ===== DELETE PATIENT =====
        function deletePatient() {
            if (!currentPatientId) return;
            if (!confirm(`⚠️ Are you sure you want to delete patient ${currentPatientId}? This cannot be undone.`)) return;

            let patients = getPatients();
            patients = patients.filter(p => p.id !== currentPatientId);
            savePatients(patients);
            closeModal();
            displayPatients(patients);
            alert('🗑️ Patient deleted successfully.');
        }

        // ===== PRINT PATIENT FILE =====
        function printPatientFile() {
            if (!currentPatientId) return;
            const patients = getPatients();
            const patient = patients.find(p => p.id === currentPatientId);
            if (!patient) return;

            const printWindow = window.open('', '_blank', 'width=800,height=600');
            printWindow.document.write(`
                <html>
                <head>
                    <title>Patient File - ${patient.id}</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 40px; max-width: 800px; margin: 0 auto; }
                        .header { text-align: center; border-bottom: 3px solid #0a6bdf; padding-bottom: 20px; margin-bottom: 20px; }
                        .header h1 { color: #0a6bdf; margin: 0; }
                        .header p { color: #666; margin: 4px 0; }
                        .section { margin-bottom: 16px; }
                        .section h3 { color: #0a1e2f; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px; margin-bottom: 10px; }
                        .row { display: flex; padding: 4px 0; }
                        .row .label { font-weight: 600; width: 150px; color: #666; }
                        .row .value { color: #0a1e2f; }
                        .med-box { background: #f0f8ff; padding: 12px; border-radius: 8px; border-left: 4px solid #0a6bdf; }
                        .med-box .med-row { display: flex; padding: 3px 0; }
                        .med-box .med-label { font-weight: 600; width: 100px; color: #666; }
                        .footer { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #e0e0e0; color: #666; font-size: 0.85rem; }
                        .status { padding: 4px 12px; border-radius: 20px; font-weight: 600; display: inline-block; }
                        .status-pending { background: #e8f0fe; color: #0a6bdf; }
                        .status-scheduled { background: #fef3c7; color: #f59e0b; }
                        .status-completed { background: #dcfce7; color: #22c55e; }
                        @media print { body { padding: 20px; } }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>🦷 Bantu Dental Hub</h1>
                        <p>Kasenyi, Entebbe, Uganda</p>
                        <p>📞 +256 758 985317</p>
                    </div>

                    <h2 style="text-align:center; color:#0a1e2f;">PATIENT FILE</h2>
                    <p style="text-align:center; color:#666;">${patient.id} | Registered: ${patient.registrationDate}</p>

                    <div class="section">
                        <h3>👤 Personal Information</h3>
                        <div class="row"><span class="label">Patient ID:</span><span class="value">${patient.id}</span></div>
                        <div class="row"><span class="label">Full Name:</span><span class="value">${patient.firstName} ${patient.lastName}</span></div>
                        <div class="row"><span class="label">Age:</span><span class="value">${patient.age}</span></div>
                        <div class="row"><span class="label">Gender:</span><span class="value">${patient.gender}</span></div>
                        <div class="row"><span class="label">Phone:</span><span class="value">${patient.phone}</span></div>
                        <div class="row"><span class="label">Email:</span><span class="value">${patient.email}</span></div>
                        <div class="row"><span class="label">Address:</span><span class="value">${patient.address}</span></div>
                    </div>

                    <div class="section">
                        <h3>🏥 Medical History</h3>
                        <div class="row"><span class="label">Allergies:</span><span class="value">${patient.allergies}</span></div>
                        <div class="row"><span class="label">Medications:</span><span class="value">${patient.medications}</span></div>
                        <div class="row"><span class="label">Conditions:</span><span class="value">${patient.conditions}</span></div>
                    </div>

                    <div class="section">
                        <h3>🦷 Treatment Plan</h3>
                        <div class="row"><span class="label">Procedure:</span><span class="value">${patient.procedure}</span></div>
                        <div class="row"><span class="label">Doctor:</span><span class="value">${patient.doctor}</span></div>
                        <div class="row"><span class="label">Description:</span><span class="value">${patient.treatmentDesc}</span></div>
                        <div class="row"><span class="label">Cost:</span><span class="value">$${patient.treatmentCost.toFixed(2)}</span></div>
                        <div class="row"><span class="label">Status:</span><span class="value"><span class="status status-${patient.status || 'pending'}">${patient.status || 'Pending'}</span></span></div>
                        <div class="row"><span class="label">Review Date:</span><span class="value">${patient.reviewDate}</span></div>
                    </div>

                    <div class="section">
                        <h3>💊 Prescribed Medication</h3>
                        <div class="med-box">
                            <div class="med-row"><span class="med-label">💊 Medication:</span><span class="med-value">${patient.medication.name}</span></div>
                            <div class="med-row"><span class="med-label">📊 Dosage:</span><span class="med-value">${patient.medication.dosage}</span></div>
                            <div class="med-row"><span class="med-label">🕐 Frequency:</span><span class="med-value">${patient.medication.frequency}</span></div>
                            <div class="med-row"><span class="med-label">📅 Duration:</span><span class="med-value">${patient.medication.duration}</span></div>
                            ${patient.medication.notes !== 'N/A' ? `<div class="med-row"><span class="med-label">📝 Notes:</span><span class="med-value">${patient.medication.notes}</span></div>` : ''}
                        </div>
                    </div>

                    <div class="footer">
                        <p>📍 Kasenyi, Entebbe, Uganda</p>
