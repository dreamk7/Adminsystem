<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bantu Dental Hub | Patient Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ===== SAME STYLES AS PATIENT-FILE.HTML ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0a6bdf;
            --primary-dark: #0850a8;
            --primary-light: #e8f0fe;
            --dark: #0a1e2f;
            --gray: #4a5a6e;
            --light-gray: #f0f4f8;
            --white: #ffffff;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.10);
            --radius: 16px;
            --transition: 0.3s ease;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--light-gray);
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        /* ===== HEADER ===== */
        .header {
            background: var(--white);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            padding: 0 24px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--dark);
            text-decoration: none;
        }

        .header .logo .brand .bantu { margin-right: 6px; }
        .header .logo .brand .dental { color: var(--primary); }

        .header .back-btn {
            color: var(--gray);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: var(--transition);
        }

        .header .back-btn:hover {
            background: var(--light-gray);
            color: var(--primary);
        }

        .page-header {
            margin: 24px 0;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 800;
        }

        .page-header h1 .highlight {
            color: var(--primary);
        }

        .page-header p {
            color: var(--gray);
        }

        .tracking-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .tracking-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: var(--transition);
        }

        .tracking-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .tracking-card .number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .tracking-card .label {
            color: var(--gray);
            font-size: 0.95rem;
        }

        .card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 24px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .card-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            text-align: left;
            padding: 12px 16px;
            font-weight: 600;
            color: var(--gray);
            font-size: 0.85rem;
            border-bottom: 2px solid var(--light-gray);
        }

        table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--light-gray);
            font-size: 0.9rem;
        }

        table tr:hover td {
            background: var(--primary-light);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-completed { background: #dcfce7; color: var(--success); }
        .status-scheduled { background: #fef3c7; color: var(--warning); }
        .status-pending { background: var(--primary-light); color: var(--primary); }

        .btn {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-primary:hover { background: var(--primary-dark); }

        .no-data {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
        }

        .no-data .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .search-box input {
            padding: 10px 16px;
            border: 2px solid var(--light-gray);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            flex: 1;
            min-width: 200px;
            transition: var(--transition);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-box button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: var(--white);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-box button:hover {
            background: var(--primary-dark);
        }

        @media (max-width: 768px) {
            .tracking-grid {
                grid-template-columns: 1fr 1fr;
            }
            .search-box { flex-direction: column; }
            .search-box input { min-width: 100%; }
            table { font-size: 0.8rem; }
            table th, table td { padding: 8px; }
        }

        @media (max-width: 500px) {
            .tracking-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <a href="index.html" class="logo">
            <span class="brand"><span class="bantu">🦷 Bantu</span><span class="dental">Dental hub</span></span>
        </a>
        <a href="index.html" class="back-btn">← Back to Dashboard</a>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main>
        <div class="container">
            <div class="page-header">
                <h1>📈 Patient <span class="highlight">Tracking</span></h1>
                <p>Track patient progress, treatment status, and review dates.</p>
            </div>

            <!-- ===== TRACKING STATS ===== -->
            <div class="tracking-grid">
                <div class="tracking-card">
                    <div class="number" id="totalPatients">0</div>
                    <div class="label">👥 Total Patients</div>
                </div>
                <div class="tracking-card">
                    <div class="number" id="completedTreatments">0</div>
                    <div class="label">✅ Completed Treatments</div>
                </div>
                <div class="tracking-card">
                    <div class="number" id="pendingReviews">0</div>
                    <div class="label">⚠️ Pending Reviews</div>
                </div>
            </div>

            <!-- ===== SEARCH ===== -->
            <div class="search-box">
                <input type="text" id="trackSearch" placeholder="🔍 Search patient by name or ID..." oninput="trackPatients()" />
                <button onclick="trackPatients()">Search</button>
                <button onclick="clearTrackSearch()" style="background:transparent; color:var(--primary); border:2px solid var(--primary);">Clear</button>
            </div>

            <!-- ===== PATIENT TRACKING TABLE ===== -->
            <div class="card">
                <div class="card-header">
                    <h3>📋 Treatment Progress</h3>
                    <span id="trackCount" style="padding:4px 12px; background:var(--primary-light); color:var(--primary); border-radius:20px; font-weight:600;">0 patients</span>
                </div>
                <div id="trackingTable">
                    <div class="no-data">
                        <span class="icon">📊</span>
                        <p>No patient data available.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ===== GET DATA =====
        function getPatients() {
            return JSON.parse(localStorage.getItem('patients')) || [];
        }

        // ===== UPDATE STATS =====
        function updateStats() {
            const patients = getPatients();
            document.getElementById('totalPatients').textContent = patients.length;
            document.getElementById('completedTreatments').textContent = patients.filter(p => p.status === 'completed').length;

            const today = new Date();
            const pending = patients.filter(p => {
                if (!p.reviewDate || p.reviewDate === 'Not set') return false;
                const review = new Date(p.reviewDate);
                return review >= today && p.status !== 'completed';
            });
            document.getElementById('pendingReviews').textContent = pending.length;
        }

        // ===== TRACK PATIENTS =====
        function trackPatients() {
            const search = document.getElementById('trackSearch').value.toLowerCase();
            let patients = getPatients();

            if (search) {
                patients = patients.filter(p =>
                    p.firstName.toLowerCase().includes(search) ||
                    p.lastName.toLowerCase().includes(search) ||
                    p.id.toLowerCase().includes(search)
                );
            }

            // Sort by review date (closest first)
            patients.sort((a, b) => {
                if (!a.reviewDate || a.reviewDate === 'Not set') return 1;
                if (!b.reviewDate || b.reviewDate === 'Not set') return -1;
                return new Date(a.reviewDate) - new Date(b.reviewDate);
            });

            displayTracking(patients);
        }

        function clearTrackSearch() {
            document.getElementById('trackSearch').value = '';
            trackPatients();
        }

        // ===== DISPLAY TRACKING =====
        function displayTracking(patients) {
            const container = document.getElementById('trackingTable');
            const count = document.getElementById('trackCount');

            if (patients.length === 0) {
                container.innerHTML = `
                    <div class="no-data">
                        <span class="icon">📊</span>
                        <p>No patients found.</p>
                    </div>
                `;
                count.textContent = '0 patients';
                return;
            }

            count.textContent = patients.length + ' patients';

            const today = new Date();

            let html = `
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Patient ID</th>
                                <th>Name</th>
                                <th>Treatment</th>
                                <th>Doctor</th>
                                <th>Status</th>
                                <th>Review Date</th>
                                <th>Days Until Review</th>
                                <th>Medication</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            patients.forEach(p => {
                const statusClass = p.status === 'completed' ? 'status-completed' :
                                  p.status === 'scheduled' ? 'status-scheduled' : 'status-pending';

                let daysUntil = 'N/A';
                let daysClass = '';
                if (p.reviewDate && p.reviewDate !== 'Not set') {
                    const review = new Date(p.reviewDate);
                    const diff = Math.ceil((review - today) / (1000 * 60 * 60 * 24));
                    daysUntil = diff + ' days';
                    daysClass = diff < 0 ? 'style="color:var(--danger); font-weight:700;"' :
                               diff <= 7 ? 'style="color:var(--warning); font-weight:700;"' :
                               'style="color:var(--success);"';
                }

                html += `
                    <tr>
                        <td><strong>${p.id}</strong></td>
                        <td>${p.firstName} ${p.lastName}</td>
                        <td>${p.procedure}</td>
                        <td>${p.doctor}</td>
                        <td><span class="status-badge ${statusClass}">${p.status || 'Pending'}</span></td>
                        <td>${p.reviewDate || 'Not set'}</td>
                        <td ${daysClass}>${daysUntil}</td>
                        <td>${p.medication && p.medication.name !== 'None prescribed' ? p.medication.name : 'None'}</td>
                    </tr>
                `;
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', function() {
            updateStats();
            trackPatients();
        });
    </script>

</body>
</html>
